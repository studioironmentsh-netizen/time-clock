<meta property="og:title" content="שעון נוכחות · iRON MENTSH">
<meta property="og:description" content="לוחצים התחלתי, איירי מאחל בהצלחה, והשעות נרשמות.">

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10163A; --ink-2:#4A5175; --ink-3:#8A90AE;
  --line:#E3E6F2; --paper:#FFFFFF; --wash:#F5F6FB;
  --cobalt:#2453E6; --violet:#7B3FE4;
  --go:#0E9F6E; --go-wash:#E6F6EF; --stop:#E5484D; --stop-wash:#FDECEC;
  --brand:linear-gradient(135deg,#2453E6 0%,#7B3FE4 100%);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Rubik,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:460px;margin:0 auto;padding:20px 16px 40px}
.wrap.wide{max-width:1120px}
header.top{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
header.top img{width:44px;height:44px}
header.top .t{font-weight:600;font-size:18px;line-height:1.2}
header.top .s{color:var(--ink-3);font-size:13px}
header.top .sp{flex:1}
.link{background:none;border:0;color:var(--cobalt);padding:8px 4px;font-weight:500}
.muted{color:var(--ink-2)}
.small{font-size:13px;color:var(--ink-3)}
h1{font-size:26px;font-weight:600;margin:6px 0 4px;letter-spacing:-.2px}
h2{font-size:19px;font-weight:600;margin:24px 0 10px}

/* מסך פתיחה */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8vh}
.hero img{width:168px;height:168px}
.hero h1{font-size:30px;margin-top:18px}
.hero .muted{margin:0 0 30px}
.btn{display:block;width:100%;border:0;border-radius:var(--r);padding:16px;font-weight:600;font-size:17px}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--wash);color:var(--ink)}
.btn.quiet{background:none;color:var(--ink-2);font-weight:500}
.btn+.btn{margin-top:10px}
.btn:disabled{opacity:.5;cursor:default}

/* רשימת שמות */
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.names button{background:var(--wash);border:1px solid var(--line);border-radius:var(--r);padding:18px 10px;font-size:17px;font-weight:500;text-align:center}
.names button.add{background:none;border-style:dashed;color:var(--cobalt)}

/* קוד אישי */
.pin-dots{display:flex;justify-content:center;gap:16px;margin:22px 0 26px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr;max-width:320px;margin:0 auto}
.pad button{height:64px;border-radius:50%;border:0;background:var(--wash);font-size:26px;font-weight:500;width:64px;justify-self:center}
.pad button.fn{background:none;font-size:15px;color:var(--ink-2)}
.check{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:22px;color:var(--ink-2)}
.check input{width:20px;height:20px;accent-color:var(--cobalt)}

/* טפסים */
label.f{display:block;margin:14px 0 6px;font-weight:500}
input.in,select.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font-size:17px}
input.in:focus,select.in:focus{border-color:var(--cobalt);outline:none;box-shadow:0 0 0 3px rgba(36,83,230,.15)}
.err{color:var(--stop);min-height:22px;margin-top:10px;font-size:15px}

/* פאנל עובד: השעון */
.hello{text-align:center;margin-top:4px}
.hello h1{margin-bottom:0}
.dial{position:relative;width:260px;height:260px;margin:22px auto 6px}
.dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
.dial .track{stroke:var(--line)}
.dial .arc{stroke:url(#g);transition:stroke-dashoffset .6s ease}
.dial .face{position:absolute;inset:22px;border-radius:50%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:26px;transition:transform .12s ease}
.dial .face:active{transform:scale(.97)}
.dial .face.start{background:var(--go)}
.dial .face.stop{background:var(--stop)}
.dial .face .sub{font-size:15px;font-weight:400;opacity:.92;margin-top:4px}
.dial .face .clock{font-size:34px;font-weight:600;margin-top:2px;letter-spacing:.5px}
.today{text-align:center;color:var(--ink-2);margin-bottom:6px}
.saved{text-align:center;font-size:14px;min-height:22px;color:var(--ink-3)}
.saved.ok{color:var(--go)}
.saved.bad{color:var(--stop)}

.proj{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}
.proj .now{display:flex;align-items:center;gap:12px;background:var(--wash);border-radius:var(--r);padding:14px}
.proj .now .dot{width:10px;height:10px;border-radius:50%;background:var(--violet);flex:none;animation:pulse 2s infinite}
.proj .now .nm{font-weight:600}
.proj .now .tm{color:var(--ink-2);font-size:14px}
.proj .now .grow{flex:1}
.proj .row{display:flex;gap:8px;margin-top:10px}
.proj .row select{flex:1}
.proj .row .btn{width:auto;padding:13px 18px;font-size:16px}
.btn.violet{background:var(--violet);color:#fff}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* מנהל */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tabs button{background:none;border:0;padding:12px 14px;font-weight:500;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--cobalt)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.bar .grow{flex:1}
.month{display:flex;align-items:center;gap:6px}
.month button{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;font-size:18px}
.month b{min-width:120px;text-align:center;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;background:var(--wash);color:var(--ink-2)}
.pill.on{background:var(--go-wash);color:#08704D}
.pill.off{background:var(--stop-wash);color:#B4282D}

table.t{width:100%;border-collapse:collapse;margin-top:6px}
table.t th{text-align:right;font-weight:500;color:var(--ink-3);font-size:13px;padding:8px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.sub td{padding:6px 8px 6px 8px;color:var(--ink-2);font-size:14px;border-bottom:0}
.tbl-wrap{overflow-x:auto}

.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.live .p{border:1px solid var(--line);border-radius:var(--r);padding:14px;border-right:4px solid var(--go)}
.live .p .nm{font-weight:600;font-size:17px}
.live .p .tm{font-size:26px;font-weight:600;margin-top:4px}
.live .p .pr{color:var(--violet);font-size:14px;margin-top:2px}
.empty{padding:30px 10px;text-align:center;color:var(--ink-2)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal .h{font-size:13px;color:var(--ink-3);text-align:center;padding:4px 0}
.cal .d{min-height:88px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:#fff;text-align:right;display:flex;flex-direction:column;gap:2px}
.cal .d.x{background:transparent;border-color:transparent}
.cal .d.today{border-color:var(--cobalt);box-shadow:inset 0 0 0 1px var(--cobalt)}
.cal .d.sel{background:var(--wash)}
.cal .d .g{font-weight:600;font-size:15px;line-height:1}
.cal .d .hb{font-size:11px;color:var(--ink-3)}
.cal .d .hrs{margin-top:auto;font-size:15px;font-weight:600;color:var(--cobalt)}
.cal .d .ppl{font-size:11px;color:var(--ink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal .d.sat{background:#FAFAFD}
@media (max-width:640px){
  .cal{gap:3px}
  .cal .d{min-height:62px;padding:4px 5px;border-radius:9px}
  .cal .d .ppl{display:none}
  .cal .d .hb{font-size:10px}
  .cal .d .hrs{font-size:13px}
}
.day{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.day h2{margin-top:0}
.ev{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.ev:last-child{border-bottom:0}
.ev .grow{flex:1}
.ev.void{opacity:.45;text-decoration:line-through}
.ev button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:13px;color:var(--stop)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-top:8px}
.form-row .btn{padding:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:9;max-width:90vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* הדמות */
.buddy{position:fixed;inset:auto 0 0 0;height:min(46vh,340px);display:flex;justify-content:center;align-items:flex-end;pointer-events:none;z-index:20}
.buddy .stage{position:relative;width:min(50vw,210px);aspect-ratio:260/320;pointer-events:auto;cursor:pointer;transform:translateY(110%)}
.buddy .stage img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 70ms linear;user-select:none;-webkit-user-drag:none}
.buddy .stage img.on{opacity:1}
.buddy .body{position:absolute;inset:0;transform-origin:50% 96%}
.buddy .bubble{position:absolute;bottom:97%;left:50%;width:max-content;max-width:min(78vw,300px);background:#fff;color:var(--ink);border:2px solid var(--violet);border-radius:18px;padding:10px 16px;font-weight:600;font-size:18px;line-height:1.35;text-align:center;box-shadow:0 6px 20px rgba(16,22,58,.12);opacity:0;transform:translateX(-50%) scale(.6);transform-origin:50% 100%;transition:opacity .2s ease,transform .25s cubic-bezier(.3,1.6,.5,1)}
.buddy .bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-9px;border:9px solid transparent;border-top-color:var(--violet)}
.buddy .bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
.buddy .bubble .who{display:block;font-size:13px;font-weight:600;color:var(--violet);margin-bottom:1px}
.buddy .bubble small{display:block;font-weight:400;font-size:14px;color:var(--ink-2)}
.buddy.in .stage{animation:buddyIn .55s cubic-bezier(.25,1.45,.45,1) forwards}
.buddy.out .stage{animation:buddyOut .35s cubic-bezier(.5,0,.9,.4) forwards}
.buddy .body.hop{animation:hop .5s cubic-bezier(.3,.7,.4,1)}
.buddy .body.sway{animation:sway 1.1s ease-in-out}
.buddy .body.dip{animation:dip .9s cubic-bezier(.4,0,.3,1)}
@keyframes buddyIn{0%{transform:translateY(110%)}100%{transform:translateY(0)}}
@keyframes buddyOut{0%{transform:translateY(0)}100%{transform:translateY(115%)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}18%{transform:translateY(2%) scale(1.06,.93)}45%{transform:translateY(-9%) scale(.96,1.05)}72%{transform:translateY(0) scale(1.04,.96)}100%{transform:translateY(0) scale(1,1)}}
@keyframes sway{0%,100%{transform:rotate(0)}22%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}76%{transform:rotate(-1.5deg)}}
@keyframes dip{0%,100%{transform:translateY(0) scale(1)}40%,62%{transform:translateY(3%) scale(1.02,.96)}}
@media (prefers-reduced-motion:reduce){.buddy .stage{transform:none!important}}
</style>
</head>

const LIVE_REFRESH_MS = 20000;
const TZ = "Asia/Jerusalem";
["icon","apple-touch-icon"].forEach(rel => { const l = document.createElement("link"); l.rel = rel; l.href = LOGO; document.head.appendChild(l); });

/* ===== אחסון מקומי (במכשיר בלבד) ===== */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("im_"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("im_"+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("im_"+k); }catch(e){} }
};
const isKiosk = () => store.get("kiosk", false);

/* ===== תקשורת עם השרת ===== */
async function api(action, body = {}){
  const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, ...body }) });
  let data;
  try { data = await res.json(); } catch(e){ throw new Error("תשובה לא תקינה מהשרת"); }
  if (!data.ok) { const e = new Error(data.error || "שגיאה"); e.server = true; throw e; }
  return data;
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,"").slice(0,20);

/* ===== תור לחיצות בלי אינטרנט ===== */
async function flushQueue(){
  const q = store.get("queue", []);
  if (!q.length) return;
  const rest = [];
  for (const item of q){
    try { await api("punch", item); }
    catch(e){ if (!e.server) rest.push(item); else toast("לחיצה שנשמרה בלי אינטרנט נדחתה: " + e.message); }
  }
  store.set("queue", rest);
  if (S.screen === "employee" && rest.length !== q.length) refreshStatus();
}
window.addEventListener("online", flushQueue);
setInterval(flushQueue, 30000);

/* ===== עזרי זמן ===== */
const fmtHM = d => new Intl.DateTimeFormat("he-IL",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:TZ}).format(new Date(d));
const fmtDay = d => new Intl.DateTimeFormat("he-IL",{weekday:"long",day:"numeric",month:"long",timeZone:TZ}).format(new Date(d));
const heDate = d => { try { return new Intl.DateTimeFormat("he-IL-u-ca-hebrew",{day:"numeric",month:"long",timeZone:TZ}).format(new Date(d)); } catch(e){ return ""; } };
// יום עברי באותיות (א׳..ל׳) וחודש עברי, ללוח השנה
function heParts(d){
  try {
    const p = new Intl.DateTimeFormat("en-u-ca-hebrew",{day:"numeric",timeZone:TZ}).formatToParts(new Date(d));
    const n = +p.find(x => x.type === "day").value;
    const month = new Intl.DateTimeFormat("he-IL-u-ca-hebrew",{month:"long",timeZone:TZ}).format(new Date(d));
    const ones = ["","א","ב","ג","ד","ה","ו","ז","ח","ט"], tens = ["","י","כ","ל"];
    let s = n === 15 ? "טו" : n === 16 ? "טז" : tens[Math.floor(n/10)] + ones[n%10];
    s = s.length > 1 ? s.slice(0,-1) + "״" + s.slice(-1) : s + "׳";
    return { day: n, letters: s, month };
  } catch(e){ return { day: 0, letters: "", month: "" }; }
}
const dayKey = d => new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit",timeZone:TZ}).format(new Date(d));
function dur(min){ min = Math.max(0, Math.round(min)); const h = Math.floor(min/60), m = min%60; return h + ":" + String(m).padStart(2,"0"); }
function durWords(min){ min = Math.max(0, Math.round(min)); const h = Math.floor(min/60), m = min%60;
  if (!h) return m + " דק׳"; if (!m) return h + " שע׳"; return h + " שע׳ " + m + " דק׳"; }
function clock(ms){ const s = Math.max(0, Math.floor(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"); }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let skew = 0; // הפרש בין שעון השרת לשעון המכשיר
const now = () => Date.now() + skew;

const $ = sel => document.querySelector(sel);
function clearTimers(){ S.timers.forEach(clearInterval); S.timers = []; }
function go(screen, extra = {}){ clearTimers(); Object.assign(S, extra, { screen }); render(); window.scrollTo(0,0); }
function render(){ ({home, pick, pin, register, employee, adminLogin, admin, setup})[S.screen](); }
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3800); }
const topBar = (sub, right = "") => `<header class="top"><img src="${LOGO}" alt="iRON MENTSH"><div><div class="t">שעון נוכחות</div><div class="s">${sub}</div></div><span class="sp"></span>${right}</header>`;

function setup(){

  <p class="muted">צריך להדביק את כתובת השרת בקוד הדף.</p></div></div>`;
}

function home(){
  const me = store.get("me", null);
  if (me && !isKiosk()) { S.emp = me.emp; S.pin = me.pin; return go("employee"); }
  $("#app").innerHTML = `<div class="wrap"><div class="hero">
    <img src="${LOGO}" alt="iRON MENTSH">
    <h1>שעון נוכחות</h1>
    <p class="muted">${isKiosk() ? "עמדת המשרד" : "iRON MENTSH"}</p>
    <div style="width:100%">
      <button class="btn primary" id="b-emp">אני עובד/ת</button>
      <button class="btn quiet" id="b-adm">כניסת מנהל</button>
    </div></div></div>`;
  $("#b-emp").onclick = () => go("pick");
  $("#b-adm").onclick = () => go("adminLogin");
}

async function pick(){
  $("#app").innerHTML = `<div class="wrap">${topBar("מי את/ה?", `<button class="link" id="back">חזרה</button>`)}
    <h1>בחר/י את השם שלך</h1><div class="names" id="names"><p class="small">טוען…</p></div><div class="err" id="err"></div></div>`;
  $("#back").onclick = () => go("home");
  try {
    const { employees } = await api("listEmployees");
    store.set("empCache", employees);
    drawNames(employees);
  } catch(e){
    const cached = store.get("empCache", []);
    drawNames(cached);
    $("#err").textContent = e.server ? e.message : "אין חיבור לאינטרנט. מוצגת הרשימה האחרונה.";
  }
}
function drawNames(list){
  const box = $("#names"); if (!box) return;
  box.innerHTML = list.map(e => `<button data-id="${esc(e.id)}">${esc(e.name)}</button>`).join("") +
    `<button class="add" id="add">+ עובד/ת חדש/ה</button>`;
  box.querySelectorAll("button[data-id]").forEach(b => b.onclick = () => go("pin", { emp: { id: b.dataset.id, name: b.textContent }, pinBuf: "" }));
  $("#add").onclick = () => go("register");
}

function pin(){
  S.pinBuf = S.pinBuf || "";
  $("#app").innerHTML = `<div class="wrap">${topBar(esc(S.emp.name), `<button class="link" id="back">חזרה</button>`)}
    <div style="text-align:center"><h1>הקוד האישי שלך</h1><p class="muted">4 ספרות</p></div>
    <div class="pin-dots" id="dots">${[0,1,2,3].map(i=>`<i class="${i < S.pinBuf.length ? "on":""}"></i>`).join("")}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}" aria-label="${n}">${n}</button>`).join("")}
      <button class="fn" id="clr">ניקוי</button><button data-n="0" aria-label="0">0</button><button class="fn" id="del" aria-label="מחיקה">⌫</button></div>
    ${isKiosk() ? "" : `<label class="check"><input type="checkbox" id="rem" checked> לזכור אותי בטלפון הזה</label>`}
    <div class="err" id="err" style="text-align:center"></div></div>`;
  $("#back").onclick = () => go("pick");
  const dots = () => $("#dots").querySelectorAll("i").forEach((d,i)=>d.classList.toggle("on", i < S.pinBuf.length));
  const press = async n => {
    if (S.pinBuf.length >= 4) return;
    S.pinBuf += n; dots();
    if (S.pinBuf.length === 4){
      const p = S.pinBuf;
      try {
        const st = await api("status", { empId: S.emp.id, pin: p });
        const remember = !isKiosk() && $("#rem") && $("#rem").checked;
        if (remember) store.set("me", { emp: S.emp, pin: p });
        go("employee", { pin: p, status: st, pinBuf: "" });
      } catch(e){
        S.pinBuf = ""; dots();
        $("#err").textContent = e.server ? e.message : "אין חיבור לאינטרנט";
      }
    }
  };
  document.querySelectorAll(".pad [data-n]").forEach(b => b.onclick = () => press(b.dataset.n));
  $("#del").onclick = () => { S.pinBuf = S.pinBuf.slice(0,-1); dots(); };
  $("#clr").onclick = () => { S.pinBuf = ""; dots(); };
  document.onkeydown = ev => { if (S.screen !== "pin") return; if (/^\d$/.test(ev.key)) press(ev.key); if (ev.key === "Backspace"){ S.pinBuf = S.pinBuf.slice(0,-1); dots(); } };
}

function register(){
  $("#app").innerHTML = `<div class="wrap">${topBar("הצטרפות", `<button class="link" id="back">חזרה</button>`)}
    <h1>עובד/ת חדש/ה</h1><p class="muted">השם יופיע ברשימה. את הקוד בוחרים פעם אחת ומקלידים בכל כניסה.</p>
    <form id="f" autocomplete="off">
      <label class="f" for="nm">שם מלא</label><input class="in" id="nm" maxlength="40" required>
      <label class="f" for="p1">קוד אישי, 4 ספרות</label><input class="in num" id="p1" inputmode="numeric" pattern="\\d{4}" maxlength="4" required>
      <label class="f" for="p2">שוב את הקוד</label><input class="in num" id="p2" inputmode="numeric" pattern="\\d{4}" maxlength="4" required>
      <div class="err" id="err"></div>
      <button class="btn primary" id="sv">הוספה</button>
    </form></div>`;
  $("#back").onclick = () => go("pick");
  $("#f").onsubmit = async ev => {
    ev.preventDefault();
    const name = $("#nm").value.trim(), p1 = $("#p1").value, p2 = $("#p2").value;
    if (!/^\d{4}$/.test(p1)) return $("#err").textContent = "הקוד צריך להיות 4 ספרות";
    if (p1 !== p2) return $("#err").textContent = "הקודים לא זהים";
    $("#sv").disabled = true;
    try {
      const { employee } = await api("register", { name, pin: p1 });
      const st = await api("status", { empId: employee.id, pin: p1 });
      if (!isKiosk()) store.set("me", { emp: employee, pin: p1 });
      go("employee", { emp: employee, pin: p1, status: st });
    } catch(e){ $("#err").textContent = e.server ? e.message : "אין חיבור לאינטרנט"; $("#sv").disabled = false; }
  };
}

/* ----- פאנל עובד ----- */
async function refreshStatus(){
  try {
    const st = await api("status", { empId: S.emp.id, pin: S.pin });
    skew = new Date(st.now).getTime() - Date.now();
    S.status = st; if (S.screen === "employee") drawEmployee();
  } catch(e){
    if (e.server && /קוד שגוי|לא נמצא|לא פעיל/.test(e.message)){ store.del("me"); toast(e.message); go("home"); }
  }
}
function employee(){
  if (!S.status){ $("#app").innerHTML = `<div class="wrap">${topBar(esc(S.emp.name))}<p class="small">טוען…</p></div>`; refreshStatus(); }
  else drawEmployee();
  S.timers.push(setInterval(tick, 1000));
  S.timers.push(setInterval(refreshStatus, 60000));
}
function drawEmployee(){
  const st = S.status, inShift = !!st.shiftStart;
  const right = `<button class="link" id="out">${isKiosk() ? "סיום" : "החלפת משתמש"}</button>`;
  const R = 112, C = 2*Math.PI*R;
  $("#app").innerHTML = `<div class="wrap">${topBar(fmtDay(now()), right)}
    <div class="hello"><h1>שלום ${esc(st.employee.name)}</h1></div>
    <div class="dial">
      <svg viewBox="0 0 260 260" aria-hidden="true"><circle class="track" cx="130" cy="130" r="${R}" fill="none" stroke-width="10"/>
      <circle class="arc" id="arc" cx="130" cy="130" r="${R}" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
      <button class="face ${inShift ? "stop":"start"}" id="punch">
        ${inShift ? `<span>סיימתי</span><span class="clock num" id="clk">00:00:00</span><span class="sub">מאז ${fmtHM(st.shiftStart)}</span>`
                  : `<span>התחלתי</span><span class="sub">לחיצה לתחילת יום</span>`}
      </button>
    </div>
    <div class="today num" id="today"></div>
    <div class="saved" id="saved"></div>
    ${inShift ? projBlock(st) : ""}
  </div>`;
  $("#out").onclick = () => { if (!isKiosk()) store.del("me"); S.status = null; go(isKiosk() ? "pick" : "home"); };
  $("#punch").onclick = () => punch(inShift ? "OUT" : "IN");
  if (inShift){
    if (st.project) $("#pend").onclick = () => punch("PEND");
    else if ($("#pstart")) $("#pstart").onclick = () => { const id = $("#psel").value; if (id) punch("PSTART", id); else $("#saved").textContent = "בחר/י פרויקט"; };
    if (st.project && $("#pswitch")) $("#pswitch").onclick = () => { const id = $("#psel").value; if (id) punch("PSTART", id); };
  }
  const q = store.get("queue", []).filter(x => x.empId === S.emp.id);
  if (q.length) setSaved("bad", `${q.length} לחיצות ממתינות לחיבור לאינטרנט`);
  tick();
}
function projBlock(st){
  const opts = st.projects.filter(p => !st.project || p.id !== st.project.id)
    .map(p => `<option value="${esc(p.id)}">${esc(p.name)}${p.client ? " · "+esc(p.client) : ""}</option>`).join("");
  if (st.project) return `<div class="proj"><div class="now"><span class="dot"></span><div class="grow"><div class="nm">${esc(st.project.name)}</div>
      <div class="tm num">בעבודה על הפרויקט <span id="pclk">0:00</span></div></div><button class="btn line" id="pend" style="width:auto;padding:10px 14px">סגירת פרויקט</button></div>
      ${opts ? `<div class="row"><select class="in" id="psel" aria-label="מעבר לפרויקט אחר"><option value="">מעבר לפרויקט אחר…</option>${opts}</select><button class="btn violet" id="pswitch">מעבר</button></div>` : ""}</div>`;
  if (!st.projects.length) return `<div class="proj small" style="text-align:center">אין עדיין פרויקטים. המנהל מוסיף אותם.</div>`;
  return `<div class="proj"><div class="small" style="margin-bottom:6px">עובד/ת על פרויקט מסוים? פותחים אותו כדי לספור לו שעות.</div>
    <div class="row"><select class="in" id="psel" aria-label="בחירת פרויקט"><option value="">בחירת פרויקט…</option>${opts}</select>
    <button class="btn violet" id="pstart">פתיחה</button></div></div>`;
}
function tick(){
  const st = S.status; if (!st || S.screen !== "employee") return;
  const t = now(), R = 112, C = 2*Math.PI*R;
  let todayMin = st.todayMinutes;
  if (st.shiftStart){
    const ms = t - new Date(st.shiftStart).getTime();
    const el = $("#clk"); if (el) el.textContent = clock(ms);
    todayMin += (t - new Date(st.now).getTime()) / 60000;
  }
  const arc = $("#arc"); if (arc) arc.style.strokeDashoffset = C * (1 - Math.min(1, todayMin / WORKDAY_MIN));
  const td = $("#today"); if (td) td.textContent = "היום: " + durWords(todayMin);
  if (st.project){ const p = $("#pclk"); if (p) p.textContent = dur((t - new Date(st.project.start).getTime())/60000); }
}

const POSES = ["idle","wave","thumbs","cheer","bow","blink"];
let buddyRun = 0;
function greeting(kind, name, minutes, again){
  const L = new Date(new Date(now()).toLocaleString("en-US",{timeZone:TZ})); // שעון ישראל
  const dow = L.getDay(), h = L.getHours();
  const first = name.split(" ")[0];
  if (kind === "IN"){
    if (again) return { t: `ברוך/ה השב/ה, ${first}!`, s: "ממשיכים מאיפה שעצרנו" };
    const hello = h < 12 ? "בוקר טוב" : h < 17 ? "צהריים טובים" : "ערב טוב";
    const tail = dow === 0 ? "שבוע מוצלח!" : dow === 4 ? "יום אחרון בשבוע, מסיימים חזק" : "בהצלחה היום!";
    return { t: `${hello}, ${first}!`, s: tail };
  }
  const hrs = minutes >= 1 ? durWords(minutes) + " היום. " : "";
  if (dow === 4 || dow === 5) return { t: `כל הכבוד, ${first}!`, s: `${hrs}סוף שבוע נעים!` };
  return { t: `כל הכבוד, ${first}!`, s: `${hrs}נתראה מחר` };
}
function buddy(kind, name, minutes, again){
  if (!SPRITES || !SPRITES.idle) return;
  const run = ++buddyRun;
  document.querySelectorAll(".buddy").forEach(b => b.remove());
  const g = greeting(kind, name, minutes, again);
  const el = document.createElement("div");
  el.className = "buddy"; el.setAttribute("role","status"); el.setAttribute("aria-label","איירי");
  el.innerHTML = `<div class="stage" title="לחיצה לסגירה"><div class="body">${POSES.map(p => `<img alt="" data-p="${p}" src="${SPRITES[p]}">`).join("")}</div>
    <div class="bubble"><span class="who">איירי</span>${esc(g.t)}<small>${esc(g.s)}</small></div></div>`;
  document.body.appendChild(el);
  const body = el.querySelector(".body"), bubble = el.querySelector(".bubble");
  const pose = p => el.querySelectorAll("img").forEach(i => i.classList.toggle("on", i.dataset.p === p));
  const move = c => { body.classList.remove("hop","sway","dip"); void body.offsetWidth; if (c) body.classList.add(c); };
  const T = [];
  const at = (ms, fn) => T.push(setTimeout(() => { if (run === buddyRun) fn(); }, ms));
  const close = () => { T.forEach(clearTimeout); el.classList.remove("in"); el.classList.add("out"); setTimeout(() => el.remove(), 400); };
  el.querySelector(".stage").onclick = close;
  pose("idle"); requestAnimationFrame(() => el.classList.add("in"));
  if (kind === "IN"){
    at(420, () => { pose("wave"); move("sway"); bubble.classList.add("on"); });
    at(1500, () => { pose("thumbs"); move("hop"); });
    at(2700, () => pose("idle"));
    at(3150, () => pose("blink"));
    at(3290, () => pose("idle"));
  } else {
    const big = minutes >= 8 * 60;
    at(450, () => { pose("bow"); move("dip"); bubble.classList.add("on"); });
    at(1700, () => { pose(big ? "cheer" : "idle"); if (big) move("hop"); });
    at(2900, () => pose("blink"));
    at(3040, () => pose(big ? "cheer" : "idle"));
  }
  at(4300, close);
}

function setSaved(cls, txt){ const s = $("#saved"); if (s){ s.className = "saved " + cls; s.textContent = txt; } }

async function punch(kind, projectId){
  const st = S.status, t = new Date(now()).toISOString();
  const req = { empId: S.emp.id, pin: S.pin, kind, projectId, clientId: uid(), source: isKiosk() ? "kiosk" : "app" };
  // תגובה מיידית במסך, השמירה רצה ברקע
  const prev = JSON.parse(JSON.stringify(st));
  if (kind === "IN") st.shiftStart = t;
  if (kind === "OUT"){ st.todayMinutes += (now() - new Date(st.shiftStart).getTime())/60000; st.shiftStart = null; st.project = null; }
  if (kind === "PSTART"){ const p = st.projects.find(x => x.id === projectId); st.project = { id: p.id, name: p.name, start: t }; }
  if (kind === "PEND") st.project = null;
  st.now = new Date(Date.now()).toISOString(); skew = 0;
  drawEmployee(); setSaved("", "שומר…");
  document.querySelectorAll("#punch,#pend,#pstart,#pswitch").forEach(b => b.disabled = true);
  try {
    S.status = await api("punch", req);
    skew = new Date(S.status.now).getTime() - Date.now();
    drawEmployee();
    const msg = { IN: "נכנסת ב-", OUT: "יצאת ב-", PSTART: "הפרויקט נפתח ב-", PEND: "הפרויקט נסגר ב-" }[kind] + fmtHM(now());
    setSaved("ok", "נשמר ✓ " + msg);
    if (kind === "IN") buddy("IN", S.status.employee.name, 0, prev.todayMinutes > 0);
    if (kind === "OUT") buddy("OUT", S.status.employee.name, S.status.todayMinutes);
    if (isKiosk() && (kind === "IN" || kind === "OUT")) setTimeout(() => { if (S.screen === "employee"){ S.status = null; go("pick"); } }, 4800);
  } catch(e){
    if (e.server){ S.status = prev; drawEmployee(); setSaved("bad", e.message); return; }
    if (isKiosk() || !store.get("me", null)){ S.status = prev; drawEmployee(); setSaved("bad", "אין חיבור לאינטרנט. הלחיצה לא נשמרה."); return; }
    const q = store.get("queue", []); q.push({ ...req, offlineTime: t }); store.set("queue", q);
    setSaved("bad", "אין אינטרנט. הלחיצה נשמרה בטלפון ותישלח כשהחיבור יחזור.");
    if (kind === "IN") buddy("IN", st.employee.name, 0, prev.todayMinutes > 0);
    if (kind === "OUT") buddy("OUT", st.employee.name, st.todayMinutes);
    document.querySelectorAll("#punch,#pend,#pstart,#pswitch").forEach(b => b.disabled = false);
  }
}

function monthStart(d){ const k = dayKey(d).split("-"); return new Date(+k[0], +k[1]-1, 1); }

async function loadAdmin(){
  const A = S.admin;
  const from = A.tab === "now" ? new Date(Date.now() - 86400000) : A.month;
  const to = A.tab === "now" ? new Date(Date.now() + 86400000) : new Date(A.month.getFullYear(), A.month.getMonth()+1, 1);
  try {
    A.data = await api("adminData", { password: A.pw, from: from.toISOString(), to: to.toISOString() });
    skew = new Date(A.data.now).getTime() - Date.now();
    if (S.screen === "admin") ({ now: paneNow, cal: paneCal, proj: paneProj, emp: paneEmp, set: paneSet })[A.tab]();
  } catch(e){
    if (e.server && /סיסמה/.test(e.message)){ toast(e.message); go("adminLogin"); return; }
    const p = $("#pane"); if (p && !A.data) p.innerHTML = `<div class="empty">${esc(e.server ? e.message : "אין חיבור לאינטרנט")}</div>`;
  }
}
const empName = id => (S.admin.data.employees.find(e => e.id === id) || {}).name || "?";
const prjName = id => (S.admin.data.projects.find(p => p.id === id) || {}).name || "?";
const minsOf = x => ((x.end ? new Date(x.end).getTime() : now()) - new Date(x.start).getTime()) / 60000;
function inMonth(x){ const A = S.admin; const k = dayKey(x.start); const m = dayKey(A.month).slice(0,7); return k.slice(0,7) === m; }

function paneNow(){
  const D = S.admin.data;
  const open = D.open.slice().sort((a,b)=> new Date(a.shiftStart) - new Date(b.shiftStart));
  const todayK = dayKey(now());
  const doneToday = {};
  D.shifts.filter(s => s.end && dayKey(s.start) === todayK).forEach(s => doneToday[s.empId] = (doneToday[s.empId]||0) + minsOf(s));
  const doneList = Object.keys(doneToday).filter(id => !open.some(o => o.empId === id));
  $("#pane").innerHTML = `<div class="bar"><b>עובדים עכשיו: ${open.length}</b><span class="grow"></span><span class="small">מתעדכן כל 20 שניות · ${fmtHM(now())}</span></div>
    ${open.length ? `<div class="live">${open.map(o => `<div class="p"><div class="nm">${esc(empName(o.empId))}</div>
      <div class="tm num" data-since="${o.shiftStart}">0:00</div><div class="small">נכנס/ה ב-${fmtHM(o.shiftStart)}</div>

}
function tickLive(){ document.querySelectorAll("[data-since]").forEach(el => el.textContent = dur((now() - new Date(el.dataset.since).getTime())/60000)); }

function perDay(){
  const D = S.admin.data, days = {};
  D.shifts.filter(inMonth).forEach(s => {
    const k = dayKey(s.start); const d = days[k] || (days[k] = { min: 0, emps: {} });
    const m = minsOf(s); d.min += m; d.emps[s.empId] = (d.emps[s.empId] || 0) + m;
  });
  return days;
}
function paneCal(){
  const A = S.admin, days = perDay();
  const y = A.month.getFullYear(), mo = A.month.getMonth();
  const first = new Date(y, mo, 1).getDay(), n = new Date(y, mo+1, 0).getDate();
  const todayK = dayKey(now());
  let total = 0; Object.values(days).forEach(d => total += d.min);
  let cells = ["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"].map(h => `<div class="h">${h}</div>`).join("");
  for (let i = 0; i < first; i++) cells += `<div class="d x"></div>`;
  const hMonths = [];
  for (let d = 1; d <= n; d++){
    const dt = new Date(y, mo, d, 12), k = dayKey(dt), info = days[k], hp = heParts(dt);
    if (!hMonths.includes(hp.month)) hMonths.push(hp.month);
    const names = info ? Object.keys(info.emps).map(empName).join(", ") : "";
    cells += `<button class="d${k===todayK?" today":""}${A.sel===k?" sel":""}${dt.getDay()===6?" sat":""}" data-k="${k}" aria-label="${fmtDay(dt)}, ${heDate(dt)}">
      <span class="g num">${d}</span><span class="hb">${hp.letters}${hp.day === 1 || d === 1 ? " " + hp.month : ""}</span>
      ${info ? `<span class="ppl">${esc(names)}</span><span class="hrs num">${dur(info.min)}</span>` : ""}</button>`;
  }
  $("#pane").innerHTML = `<p class="muted">${hMonths.join("–")} · סה״כ החודש: <b class="num">${durWords(total)}</b>. לחיצה על יום פותחת את הפירוט ומאפשרת לתקן.</p>
    <div class="cal">${cells}</div><div id="dayBox"></div>`;
  document.querySelectorAll(".cal .d[data-k]").forEach(b => b.onclick = () => { A.sel = b.dataset.k; paneCal(); });
  if (A.sel) drawDay(A.sel);
}

function exportCsv(){

    rows.push([empName(s.empId), dayKey(s.start), fmtHM(s.start), s.end ? fmtHM(s.end) : "פתוח", dur(m), (m/60).toFixed(2), ""]);
    D.segments.filter(g => g.empId === s.empId && new Date(g.start) >= new Date(s.start) && (!s.end || new Date(g.start) <= new Date(s.end)))
      .forEach(g => { const gm = minsOf(g); rows.push([empName(g.empId), dayKey(g.start), fmtHM(g.start), g.end ? fmtHM(g.end) : "פתוח", dur(gm), (gm/60).toFixed(2), prjName(g.projectId)]); });
  });
  const csv = "﻿" + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "נוכחות-" + dayKey(S.admin.month).slice(0,7) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ===== התחלה ===== */
if (API_URL.indexOf("%%") === 0) go("setup");
else {
  let pw = null; try { pw = sessionStorage.getItem("im_admin"); } catch(e){}
  if (pw && location.hash === "#admin") go("admin", { admin: { pw, tab: "now", month: monthStart(new Date()), sel: null, data: null } });
  else go("home");
  flushQueue();
}
